[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis_worker_supervisor"
version = "0.1.0"
description = "Isolated Local Worker Supervisor and Watchdog Prototype"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "psutil>=5.9,<8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["jarvis_worker_supervisor", "jarvis_simulated_worker"]
