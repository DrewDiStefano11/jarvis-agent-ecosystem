[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis_worker_supervisor"
version = "0.1.0"
description = "Isolated Local Worker Supervisor and Watchdog Prototype"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "alembic>=1.14,<2",
    "psutil>=5.9,<8",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
jarvis-worker-supervisor = "jarvis_worker_supervisor.cli:main"
jarvis-simulated-worker = "jarvis_simulated_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jarvis_worker_supervisor*", "jarvis_simulated_worker*"]

[tool.setuptools.package-data]
jarvis_worker_supervisor = [
    "migrations/*.mako",
    "migrations/versions/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
