[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis_context_assembler"
version = "0.1.0"
description = "Isolated Prompt and Context-Assembly Security Prototype"
authors = [
    { name = "Jarvis Prototype", email = "prototype@example.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
