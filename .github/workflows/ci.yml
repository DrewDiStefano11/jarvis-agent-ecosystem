name: Phase 2A durable control-plane checks
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  backend-static:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e './apps/api[dev]'
      - run: python -m ruff format apps/api scripts --check
      - run: python -m ruff check apps/api scripts
      - name: Prove backend shard coverage against full pytest collection
        run: python scripts/backend_ci.py check --artifacts "${{ runner.temp }}/backend-check"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-collection
          path: ${{ runner.temp }}/backend-check
          retention-days: 7
          if-no-files-found: warn

  backend-migrations:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e './apps/api[dev]'
      - name: Timed blank SQLite upgrade, downgrade, and re-upgrade
        run: python scripts/backend_ci.py migrations --artifacts "${{ runner.temp }}/backend-migrations"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-migrations
          path: ${{ runner.temp }}/backend-migrations
          retention-days: 7
          if-no-files-found: warn

  backend-tests:
    name: backend-tests-${{ matrix.shard }}
    runs-on: windows-latest
    # Pytest has inactivity/per-test guards. Bound the other steps individually;
    # retain the platform ceiling without an accumulated-runtime pytest deadline.
    strategy:
      fail-fast: false
      matrix:
        shard: [runtime, autonomy, models, system]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/setup-python@v5
        timeout-minutes: 10
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e './apps/api[dev]'
        timeout-minutes: 15
      - name: Serial pytest shard with timings and hang diagnostics
        run: python scripts/backend_ci.py ${{ matrix.shard }} --artifacts "${{ runner.temp }}/backend-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        if: always()
        with:
          name: backend-${{ matrix.shard }}
          path: ${{ runner.temp }}/backend-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: warn

  # Preserve the existing required status context while gating every backend job.
  backend:
    if: always()
    needs: [backend-static, backend-migrations, backend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all backend checks
        env:
          BACKEND_RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c "import json, os; results = json.loads(os.environ['BACKEND_RESULTS']); assert all(job['result'] == 'success' for job in results.values()), results"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: backend-evidence
      - name: Require exact collected-test union across shards
        run: python scripts/backend_ci.py verify --artifacts backend-evidence

  frontend:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: pnpm/action-setup@v4
        with: {version: '11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm typecheck
        working-directory: apps/web
      - run: pnpm lint
        working-directory: apps/web
      - run: pnpm test
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
  repository-integrity:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked runtime and generated artifacts
        shell: pwsh
        run: |
          git diff --check
          $tracked = git ls-files
          $forbidden = $tracked | Where-Object {
            $_ -match '(^|/)(node_modules|dist|build|coverage|data|\.venv|__pycache__|\.pytest_cache|\.ruff_cache)(/|$)' -or
            $_ -match '\.(db|db-shm|db-wal|pyc|tsbuildinfo)$' -or
            $_ -match '(^|/)\.env$'
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Forbidden tracked artifact: $_" }
            throw "Generated or sensitive runtime artifacts are tracked."
          }

  runtime-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: pnpm/action-setup@v4
        with: {version: '11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml}
      - run: python -m pip install -e './apps/api[dev]'
      - run: ruff format scripts --check
      - run: ruff check scripts
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web office:assets
      - name: Original office collision and registration evidence
        run: node scripts/build-office-network.cjs
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - name: Real process and frontend submission contract
        run: python scripts/smoke-local-planning.py
      - name: Browser golden path and office interaction checks
        run: python scripts/smoke-local-planning.py
        env:
          JARVIS_SMOKE_BROWSER: 'true'
          SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/jarvis-browser
      - name: Persisted live office and runtime activity
        run: python scripts/smoke-local-planning.py
        env:
          JARVIS_SMOKE_BROWSER: 'true'
          JARVIS_SMOKE_OFFICE: 'true'
          SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/jarvis-browser/live-office
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-browser-evidence
          path: ${{ runner.temp }}/jarvis-browser
          if-no-files-found: warn
